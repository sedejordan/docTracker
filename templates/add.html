<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Document - DocTracker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/doctracker.css">
  </head>
  <body>
    <div class="container form-container">

      <div class="top-bar">
        <h1 class="logo">DocTracker</h1>
      </div>

      <h2 class="page-title">Add Document</h2>

      {% if error %}
        <div class="alert-error">{{ error }}</div>
      {% endif %}

      <!-- enctype="multipart/form-data" is only needed for file uploads.
           Add it back to the <form> tag above when uploads are re-enabled. -->
      <form method="POST" class="doc-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="e.g. Passport, License, Contract" />
        </div>

        <div class="form-group">
          <label for="expiry_date">Expiry Date</label>
          <input type="date" id="expiry_date" name="expiry_date" />
        </div>

        <!-- FILE UPLOAD FEATURE: DISABLED FOR MVP
        <div class="form-group">
          <label for="document_file">Document file (optional)</label>
          <input type="file" id="document_file" name="document_file" accept=".pdf,.png,.jpg,.jpeg,.docx,.doc,.txt" />
        </div>
        -->

        <div class="form-actions">
          <button type="submit" class="btn primary">Add Document</button>
          <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
      </form>

    </div>
  </body>
</html>
