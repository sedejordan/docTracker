{% extends "base.html" %}
{% block title %}Server Error | Fritt Tracker{% endblock %}
{% block content %}

<div class="bg-white border border-line rounded-xl py-20 px-6 text-center">
  <div class="max-w-md mx-auto">
    <div class="text-8xl mb-4">🔧</div>
    <h1 class="text-2xl font-display font-bold text-ink mb-4">Something Went Wrong</h1>
    <p class="text-muted mb-8">We're experiencing technical difficulties. Please try again in a few minutes.</p>
    
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/" class="px-6 py-3 rounded-md bg-fritt text-white font-medium hover:bg-fritt-dark transition-colors">
        Go Home
      </a>
      {% if session.get("user_id") %}
      <a href="/add" class="px-6 py-3 rounded-md border border-line text-ink font-medium hover:bg-paper transition-colors">
        Add Document
      </a>
      {% endif %}
    </div>
  </div>
</div>

{% endblock %}
