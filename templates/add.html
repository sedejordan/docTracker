{% extends "base.html" %}
{% block title %}Add Document - Fritt Tracker{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-line rounded-xl p-8 shadow-sm">
  <h2 class="font-display font-bold text-xl text-ink mb-6">Add Document</h2>

  {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-3 py-2 mb-4">{{ error }}</div>
  {% endif %}

  <!-- enctype="multipart/form-data" is only needed for file uploads.
       Add it back to the <form> tag above when uploads are re-enabled. -->
  <form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="title" class="block text-sm font-medium mb-1">Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. Passport, License, Contract" autofocus
             class="w-full px-3 py-2 border border-line rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fritt focus:border-transparent">
    </div>
    <div>
      <label for="expiry_date" class="block text-sm font-medium mb-1">Expiry Date</label>
      <input type="date" id="expiry_date" name="expiry_date"
             class="w-full px-3 py-2 border border-line rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fritt focus:border-transparent">
    </div>

    <!-- FILE UPLOAD FEATURE: DISABLED FOR MVP
    <div>
      <label for="document_file" class="block text-sm font-medium mb-1">Document file (optional)</label>
      <input type="file" id="document_file" name="document_file" accept=".pdf,.png,.jpg,.jpeg,.docx,.doc,.txt">
    </div>
    -->

    <div class="flex gap-2">
      <button type="submit" class="px-4 py-2 rounded-md bg-fritt text-white font-medium text-sm hover:bg-fritt-dark transition-colors">Add Document</button>
      <a href="/" class="px-4 py-2 rounded-md border border-line text-sm hover:bg-paper transition-colors">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
