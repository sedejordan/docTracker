<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Document - DocTracker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/doctracker.css">
  </head>
  <body>
    <div class="container form-container">

      <div class="top-bar">
        <h1 class="logo">DocTracker</h1>
      </div>

      <h2 class="page-title">Edit Document</h2>

      {% if error %}
        <div class="alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST" class="doc-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label for="title">Title</label>
          <!-- doc.title / doc.expiry_date, not doc[1] / doc[2] - get_owned_document()
               returns a dictionary (see app.py), so attribute-style access is what
               actually reads the right values. The old doc[1]/doc[2] silently
               rendered blank fields instead of erroring. -->
          <input type="text" id="title" name="title" value="{{ doc.title }}" autofocus>
        </div>

        <div class="form-group">
          <label for="expiry_date">Expiry Date</label>
          <input type="date" id="expiry_date" name="expiry_date" value="{{ doc.expiry_date }}">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary">Update Document</button>
          <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
      </form>

    </div>
  </body>
</html>
