{% extends "base.html" %}
{% block title %}Delete Account - Fritt Tracker{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-4 bg-white border border-line rounded-xl p-8 shadow-sm">
  <h2 class="font-display font-bold text-xl mb-6 text-red-700">Delete Account</h2>

  <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-3 py-2 mb-4">
    This permanently deletes your account and every document you've added. This cannot be undone.
  </div>

  {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-3 py-2 mb-4">{{ error }}</div>
  {% endif %}

  <form method="POST" class="space-y-4">
    {{ csrf_token() }}
    <div>
      <label for="password" class="block text-sm font-medium mb-1">Enter your password to confirm</label>
      <div class="relative">
        <input type="password" id="password" name="password" placeholder="At least 8 characters" autofocus required
                class="w-full px-3 py-2 border border-line rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fritt focus:border-transparent pr-10">
        <button type="button" onclick="togglePassword('password', this)"
                title="Show/hide password"
                aria-label="Toggle password visibility" 
                class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink transition-colors">
          <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="flex gap-2">
      <button type="submit" class="px-4 py-2 rounded-md bg-red-600 text-white font-medium text-sm hover:bg-red-700 transition-colors">Permanently Delete My Account</button>
      <a href="/" class="px-4 py-2 rounded-md border border-line text-sm hover:bg-paper transition-colors">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
