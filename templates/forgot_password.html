<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DocTracker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/doctracker.css">
  </head>
  <body class="login-page">
    <div class="login-card">

      <h1 class="logo login-logo">DocTracker</h1>
      <h2 class="page-title login-title">Forgot Password</h2>

      {% if message %}
        <div class="alert-error">{{ message }}</div>
      {% else %}
        <p>Enter your email and we'll send you a link to reset your password.</p>
      {% endif %}

      {% if not message %}
      <form method="POST" class="doc-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autofocus required>
        </div>

        <div class="form-actions login-actions">
          <button type="submit" class="btn primary login-btn">Send Reset Link</button>
        </div>
      </form>
      {% endif %}

      <p class="login-footer">
        <a href="/login">Back to login</a>
      </p>

    </div>
  </body>
</html>
