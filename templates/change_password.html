<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - DocTracker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/doctracker.css">
  </head>
  <body>
    <div class="container form-container">

      <div class="top-bar">
        <h1 class="logo">DocTracker</h1>
      </div>

      <h2 class="page-title">Change Password</h2>

      {% if error %}
        <div class="alert-error">{{ error }}</div>
      {% endif %}
      {% if success %}
        <div class="alert-error">{{ success }}</div>
      {% endif %}

      <form method="POST" class="doc-form">
        <div class="form-group">
          <label for="current_password">Current Password</label>
          <input type="password" id="current_password" name="current_password" autofocus required>
        </div>

        <div class="form-group">
          <label for="new_password">New Password</label>
          <input type="password" id="new_password" name="new_password" placeholder="At least 8 characters" required>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary">Update Password</button>
          <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
      </form>

    </div>
  </body>
</html>
