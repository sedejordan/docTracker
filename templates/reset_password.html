<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DocTracker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/doctracker.css">
  </head>
  <body class="login-page">
    <div class="login-card">

      <h1 class="logo login-logo">DocTracker</h1>
      <h2 class="page-title login-title">Reset Password</h2>

      {% if invalid %}
        <div class="alert-error">This reset link is invalid or has expired.</div>
        <p class="login-footer">
          <a href="/forgot-password">Request a new link</a>
        </p>
      {% else %}
        {% if error %}
          <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="doc-form">
          <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" autofocus required>
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
          </div>

          <div class="form-actions login-actions">
            <button type="submit" class="btn primary login-btn">Reset Password</button>
          </div>
        </form>
      {% endif %}

    </div>
  </body>
</html>
