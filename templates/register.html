{% extends "base.html" %}
{% block title %}Sign Up - Fritt Tracker{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 bg-white border border-line rounded-xl p-8 shadow-sm">
  <h1 class="font-display font-bold text-2xl text-center">Fritt <span class="text-fritt">Tracker</span></h1>
  <h2 class="text-center text-muted text-sm mb-6">Create account</h2>

  {% if error %}
  <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-3 py-2 mb-4">
    {{ error }}
    {% if "already exists" in error %}
      <a href="/login" class="text-fritt underline ml-1">Log in instead</a>
    {% endif %}
  </div>
  {% endif %}
  <form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="email" class="block text-sm font-medium mb-1">Email</label>
      <input type="email" id="email" name="email" autofocus required
             class="w-full px-3 py-2 border border-line rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fritt focus:border-transparent">
    </div>
    <div>
      <label for="password" class="block text-sm font-medium mb-1">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required
             class="w-full px-3 py-2 border border-line rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fritt focus:border-transparent">
    </div>
    <button type="submit" class="w-full py-2 rounded-md bg-fritt text-white font-medium text-sm hover:bg-fritt-dark transition-colors">Sign Up</button>
  </form>

  <p class="text-center text-sm text-muted mt-4">
    Already have an account? <a href="/login" class="text-fritt hover:underline">Log in</a>
  </p>
</div>
{% endblock %}
